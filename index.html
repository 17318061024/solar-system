      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #050510;
        color: #ffffff;
        overflow: hidden;
        height: 100vh;
      }
      #canvas-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      /* 顶部导航栏 */
      .top-nav {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 100;
        background: rgba(15, 15, 35, 0.85);
        padding: 8px 16px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
      }
      .nav-tab {
        padding: 8px 20px;
        border-radius: 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s;
        color: #888;
        background: transparent;
      }
      .nav-tab:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
      }
      .nav-tab.active {
        color: #fff;
        background: linear-gradient(135deg, #ff6b35, #ff8f5a);
      }

      /* 卡片样式 */
      .card {
        background: rgba(10, 10, 25, 0.92);
        border-radius: 16px;
        padding: 20px;
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 100;
      }
      .card h3 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 16px;
        color: #ccc;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* 左侧卡片 */
      .left-card {
        position: fixed;
        left: 20px;
        top: 80px;
        width: 260px;
        max-height: calc(100vh - 200px);
        overflow-y: auto;
      }
      .ranking-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .ranking-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .ranking-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .ranking-item.active {
        background: rgba(255, 180, 100, 0.15);
        border: 1px solid rgba(255, 150, 80, 0.3);
      }
      .rank-num {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
      }
      .rank-num.gold {
        background: linear-gradient(135deg, #f5d76e, #d4a628);
        color: #000;
      }
      .rank-num.blue {
        background: linear-gradient(135deg, #4fc3f7, #0288d1);
        color: #fff;
      }
      .rank-num.other {
        background: rgba(255, 255, 255, 0.15);
        color: #666;
      }
      .bank-info {
        flex: 1;
      }
      .bank-info .name {
        font-size: 13px;
        font-weight: 500;
        color: #eee;
      }
      .bank-info .amount {
        font-size: 11px;
        color: #00ff88;
        margin-top: 2px;
      }
      .progress-bar {
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        margin-top: 6px;
        overflow: hidden;
      }
      .progress-bar .fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.3s;
      }
      .progress-bar .fill.normal {
        background: linear-gradient(90deg, #4fc3f7, #0288d1);
      }
      .progress-bar .fill.warning {
        background: linear-gradient(90deg, #ffd54f, #ff8f00);
      }
      .progress-bar .fill.danger {
        background: linear-gradient(90deg, #ef5350, #c62828);
      }

      /* 右侧卡片 */
      .right-card {
        position: fixed;
        right: 20px;
        width: 280px;
      }
      .right-card.core-card {
        top: 80px;
      }
      .right-card.detail-card {

      }

      .core-metric {
        display: flex;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .metric-box {
        text-align: center;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        flex: 1;
      }
      .metric-box .value {
        font-size: 22px;
        font-weight: 700;
        background: linear-gradient(135deg, #ffd700, #ff6b35);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .metric-box .label {
        font-size: 10px;
        color: #888;
        margin-top: 4px;
      }

      .core-stats {
        margin: 16px 0;
        padding: 12px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 10px;
      }
      .core-stats .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .core-stats .stat-row:last-child {
        margin-bottom: 0;
      }
      .core-stats .stat-row .label {
        color: #888;
      }
      .core-stats .stat-row .value {
        color: #fff;
        font-weight: 500;
      }

      .detail-chart {
        height: 120px;
      }

      .capability-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .capability-item {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .capability-item .label {
        font-size: 11px;
        color: #aaa;
        width: 60px;
      }
      .capability-item .bar {
        flex: 1;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      .capability-item .bar .fill {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #00d4aa, #00ff88);
      }
      .capability-item .value {
        font-size: 11px;
        color: #00ff88;
        width: 40px;
        text-align: right;
      }

      /* 标签 */
      .core-label {
        position: absolute;
        pointer-events: none;
        text-align: center;
        transform: translate(-50%, -100%);
        z-index: 50;
        padding: 10px 16px;
        background: rgba(255, 107, 53, 0.2);
        border-radius: 20px;
        border: 1px solid rgba(255, 107, 53, 0.4);
        backdrop-filter: blur(10px);
      }
      .core-label .name {
        font-weight: 700;
        font-size: 14px;
        color: #ff6b35;
      }
      .core-label .data {
        font-size: 10px;
        color: #ccc;
        margin-top: 4px;
      }
      .core-label .data span {
        color: #00ff88;
      }

      .node-label {
        position: absolute;
        pointer-events: none;
        font-size: 11px;
        text-align: center;
        transform: translate(-50%, -50%);
        z-index: 50;
        padding: 4px 10px;

        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s;
      }
      .node-label .abbr {

      .node-label .amount {

        color: #00ff88;
        margin-top: 2px;

      .node-label.warning {

        padding: 14px 18px;
        min-width: 160px;
        text-align: left;
      }
      .node-label.extended .name {

        display: block;

      }
      .node-label.extended .amount {
        font-size: 12px;

      .node-label.extended .stats {

      }
      .node-label.extended .stat span {

      .hint-bar {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);

        border-radius: 20px;

        color: #666;

        border: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 100;
      }

        color: #00ff88;
      }

      ::-webkit-scrollbar {

      }

        background: rgba(255, 255, 255, 0.05);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
      }
    </style>
  </head>

      // 按授信额度排序
      institutions.sort((a, b) => parseFloat(b.credit) - parseFloat(a.credit));

      // 全局配置
      const ORBIT_SPEED = (Math.PI * 2) / 10000;
      const CORE_RADIUS = 35;
      const orbitRadii = [140, 180, 220, 260, 300, 340];
      const layerYs = [40, 20, 0, -20, -40];

      // 初始化角度和轨道
      institutions.forEach((inst, index) => {
        inst.angle = (index / institutions.length) * Math.PI * 2;
        inst.orbitRadius = orbitRadii[index % 6];
        inst.orbitY = layerYs[index % 5];
        inst.curveHeight = index % 2 === 0 ? 60 : -30;
      });

      // Three.js 场景
      let scene, camera, renderer;
      let coreSphere,
        coreGlowRings = [];
      let nodeSpheres = [];
      let nodeLabels = [];
      let connectionLines = [];
      let lineParticles = [];
      let starField;
      let raycaster, mouse;
      let hoveredNode = null;
      let selectedNode = null;
      let isDragging = false;
      let lastMouseX,
        lastMouseY,
        cameraAngleX = 0,
        cameraAngleY = 0.3;
      let currentRegion = 'global';

      function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(
          55,
          window.innerWidth / window.innerHeight,
          0.1,
          3000,
        );
        camera.position.set(0, 180, 420);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

          .getElementById('canvas-container')
          .appendChild(renderer.domElement);

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);

        const pointLight = new THREE.PointLight(0xffffff, 1.5, 500);
        pointLight.position.set(50, 100, 100);
        scene.add(pointLight);

        createStarField();
        createCoreSphere();
        createNodeSpheres();
        createCoreLabel();
        initUI();
        initCharts();

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        // 事件监听
        window.addEventListener('resize', onWindowResize);
        renderer.domElement.addEventListener('mousedown', onMouseDown);
        renderer.domElement.addEventListener('mousemove', onMouseMove);
        renderer.domElement.addEventListener('mouseup', onMouseUp);
        renderer.domElement.addEventListener('click', onClick);
        renderer.domElement.addEventListener('wheel', onWheel, {
          passive: false,
        });

        // 导航切换

              .querySelectorAll('.nav-tab')
              .forEach((t) => t.classList.remove('active'));
            tab.classList.add('active');
            currentRegion = tab.dataset.region;
            filterNodesByRegion();
          });
        });

        animate();
      }

      // 创建星空背景
      function createStarField() {
        const geometry = new THREE.BufferGeometry();
        const count = 5000;
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const sizes = new Float32Array(count);

        for (let i = 0; i < count; i++) {
          const r = 600 + Math.random() * 600;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);

          positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = r * Math.cos(phi);

          // 多样化星星颜色：白色、淡蓝、淡黄
          const colorType = Math.random();
          const brightness = 0.4 + Math.random() * 0.6;
          if (colorType < 0.6) {
            // 白色
            colors[i * 3] = brightness;
            colors[i * 3 + 1] = brightness;
            colors[i * 3 + 2] = brightness;
          } else if (colorType < 0.8) {
            // 淡蓝色
            colors[i * 3] = brightness * 0.7;
            colors[i * 3 + 1] = brightness * 0.8;
            colors[i * 3 + 2] = brightness;
          } else {
            // 淡黄色
            colors[i * 3] = brightness;
            colors[i * 3 + 1] = brightness * 0.9;
            colors[i * 3 + 2] = brightness * 0.6;
          }

          sizes[i] = 0.5 + Math.random() * 2;
        }

        geometry.setAttribute(
          'position',
          new THREE.BufferAttribute(positions, 3),
        );
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const material = new THREE.PointsMaterial({
          size: 2,
          vertexColors: true,
          transparent: true,
          opacity: 0.9,
          sizeAttenuation: true,
        });

        starField = new THREE.Points(geometry, material);
        scene.add(starField);
      }

      // 创建核心恒星
      function createCoreSphere() {
        // 加载真实世界地图纹理
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load(
          'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
        );

        // 核心球体
        const coreGeometry = new THREE.SphereGeometry(CORE_RADIUS, 64, 64);
        const coreMaterial = new THREE.MeshPhongMaterial({
          map: earthTexture,
          emissive: 0xff6b35,
          emissiveIntensity: 0.3,
          shininess: 30,
        });

        coreSphere = new THREE.Mesh(coreGeometry, coreMaterial);
        coreSphere.position.set(0, 0, 0);
        coreSphere.userData = { isCore: true };
        scene.add(coreSphere);

        // 两个大圈 - 内层深色，外层浅色，几乎在最内层轨道球体附近
        const orbitRingColors = [0x4fc3f7, 0x29b6f6];
        const orbitRingRadii = [130, 185];

        for (let i = 0; i < 2; i++) {
          const ringGeo = new THREE.RingGeometry(
            orbitRingRadii[i] - 1,
            orbitRingRadii[i] + 1,
            128,
          );
          const ringMat = new THREE.MeshBasicMaterial({
            color: orbitRingColors[i],
            transparent: true,
            opacity: i === 0 ? 0.3 : 0.04,
            side: THREE.DoubleSide,
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = Math.PI / 2;
          ring.userData = {
            baseOpacity: i === 0 ? 0.15 : 0.08,
            index: i,
            speed: 0.0003 + i * 0.0002,
          };
          coreSphere.add(ring);
          coreGlowRings.push(ring);
        }

        // 外层光晕
        const glowGeo = new THREE.SphereGeometry(CORE_RADIUS + 8, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({
          color: 0xff6b35,
          transparent: true,
          opacity: 0.2,
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        coreSphere.add(glow);
        coreSphere.userData.glow = glow;
      }

      // 创建行星节点
      function createNodeSpheres() {
        institutions.forEach((inst, index) => {
          const size =
            inst.category === 'large'
              ? 18
              : inst.category === 'medium'
                ? 14
                : 10;
          const color = new THREE.Color(inst.color);

          const geometry = new THREE.SphereGeometry(size, 32, 32);
          const material = new THREE.MeshPhongMaterial({
            color: color,
            emissive: color,
            emissiveIntensity: 0.5,
            shininess: 60,
          });

          const sphere = new THREE.Mesh(geometry, material);
          sphere.position.set(
            Math.cos(inst.angle) * inst.orbitRadius,
            inst.orbitY,
            Math.sin(inst.angle) * inst.orbitRadius,
          );
          sphere.userData = {
            inst,
            angle: inst.angle,
            baseSize: size,
            isSelected: false,
            isWarning: inst.level === 'warning' || inst.level === 'danger',
          };
          scene.add(sphere);
          nodeSpheres.push(sphere);

          // 蓝色光圈 - 紧贴球体，朝向相机
          const glowRingGeo = new THREE.RingGeometry(size + 0.5, size + 4, 64);
          const glowRingMat = new THREE.MeshBasicMaterial({
            color: 0x4fc3f7,
            transparent: true,
            opacity: 0.25,
            side: THREE.DoubleSide,
          });
          const glowRing = new THREE.Mesh(glowRingGeo, glowRingMat);
          scene.add(glowRing);
          sphere.userData.glowRing = glowRing;

          // 白色半圆 - 头部亮尾部暗渐变
          const createTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            // 线性渐变：尾部透明 → 头部最亮
            const gradient = ctx.createLinearGradient(0, 0, 256, 0);
            gradient.addColorStop(0, 'rgba(255,255,255,0)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0.4)');
            gradient.addColorStop(0.6, 'rgba(255,255,255,0.9)');
            gradient.addColorStop(1, 'rgba(255,255,255,1)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 256, 64);
            return new THREE.CanvasTexture(canvas);
          };
          const arcTexture = createTexture();
          const arcGeo = new THREE.RingGeometry(
            size + 0.8,
            size + 2.3,
            32,
            1,
            0,
            Math.PI,
          );
          const arcMat = new THREE.MeshBasicMaterial({
            map: arcTexture,
            transparent: true,
            opacity: 1,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
          });
          const arc = new THREE.Mesh(arcGeo, arcMat);
          scene.add(arc);
          sphere.userData.arc = arc;

          // 呼吸光环 - 默认隐藏，选中时显示
          const ringGeo = new THREE.TorusGeometry(size * 1.6, 1.2, 16, 48);
          const ringMat = new THREE.MeshBasicMaterial({
            color: color,
            transparent: true,
            opacity: 0,
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = Math.PI / 2;
          sphere.add(ring);
          sphere.userData.ring = ring;

          // 红圈警示标记 - 默认隐藏
          if (inst.level === 'warning' || inst.level === 'danger') {
            const warningRing = new THREE.Mesh(
              new THREE.TorusGeometry(size * 2.2, 1.5, 16, 48),
              new THREE.MeshBasicMaterial({
                color: 0xff3333,
                transparent: true,
                opacity: 0,
              }),
            );
            warningRing.rotation.x = Math.PI / 2;
            sphere.add(warningRing);
            sphere.userData.warningRing = warningRing;
          }

          createConnectionLine(sphere, inst);
          createNodeLabel(sphere, inst);
        });
      }

      // 创建连线 - 使用Line实现线条效果
      function createConnectionLine(sphere, inst) {
        setTimeout(() => {
          const startY = 0;
          const midY = inst.curveHeight;

          const curve = new THREE.QuadraticBezierCurve3(
            new THREE.Vector3(0, startY, 0),
            new THREE.Vector3(
              sphere.position.x * 0.5,
              midY,
              sphere.position.z * 0.5,
            ),
            sphere.position.clone(),
          );

          // 使用Line实现线条效果
          const line = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(curve.getPoints(50)),
            new THREE.LineBasicMaterial({
              color: 0x888888,
              transparent: true,
              opacity: 0.3,
            }),
          );
          line.userData = {
            inst,
            baseOpacity: 0.3,
            sphereColor: inst.color,
            curve: curve,
            sphereRef: sphere,
          };
          scene.add(line);
          connectionLines.push({ line, sphere, inst });

          // 创建球体外抛粒子 - 从球体外侧往外下方抛出
          createTrailParticles(sphere);
        }, 50);
      }

      // 球体外抛粒子效果 - 沿球体外侧运动
      function createTrailParticles(sphere) {
        const count = 30;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
          positions[i * 3] = 0;
          positions[i * 3 + 1] = 0;
          positions[i * 3 + 2] = 0;
        }

        geometry.setAttribute(
          'position',
          new THREE.BufferAttribute(positions, 3),
        );

        // 创建圆形粒子纹理
        const createCircleTexture = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 64;
          canvas.height = 64;
          const ctx = canvas.getContext('2d');
          const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
          gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
          gradient.addColorStop(0.4, 'rgba(255, 255, 255, 0.8)');
          gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, 64, 64);
          return new THREE.CanvasTexture(canvas);
        };

        const circleTexture = createCircleTexture();

        const material = new THREE.PointsMaterial({
          size: 5,
          map: circleTexture,
          color: 0xffffff,
          transparent: true,
          opacity: 0.4,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        const data = {
          particles,
          sphere,
          velocities: [],
        };

        for (let i = 0; i < count; i++) {
          data.velocities.push({
            x: 0,
            y: 0,
            z: 0,
            active: false,
            life: 0,
          });
        }

        lineParticles.push(data);
      }

      // 创建节点标签
      function createNodeLabel(sphere, inst) {
        const label = document.createElement('div');
        label.className = `node-label ${inst.level === 'warning' || inst.level === 'danger' ? 'warning' : ''}`;
        label.innerHTML = `<div class="abbr">${inst.abbr}</div><div class="amount">${inst.credit}</div>`;
        document.body.appendChild(label);
        nodeLabels.push({ element: label, sphere, inst, isExtended: false });
      }

      // 创建核心标签
      function createCoreLabel() {
        const label = document.createElement('div');
        label.className = 'core-label';
        label.innerHTML = `<div class="name">核心主体</div><div class="data">总授信 <span>$2.84T</span></div>`;
        document.body.appendChild(label);
        window.coreLabel = { element: label, sphere: coreSphere };
      }

      // 初始化UI
      function initUI() {
        const list = document.getElementById('rankingList');
        institutions.forEach((inst, i) => {
          const item = document.createElement('div');
          item.className = 'ranking-item';
          const barClass =
            inst.level === 'danger'
              ? 'danger'
              : inst.level === 'warning'
                ? 'warning'
                : 'normal';
          const barWidth = ((parseFloat(inst.credit) / 1800) * 100).toFixed(0);
          const rankClass =
            inst.category === 'large'
              ? 'gold'
              : inst.category === 'medium'
                ? 'blue'
                : 'other';
          item.innerHTML = `
                    <div class="rank-num ${rankClass}">${i + 1}</div>
                    <div class="bank-info">
                        <div class="name">${inst.name} <small style="color:#888">${inst.abbr}</small></div>
                        <div class="amount">${inst.credit}</div>
                        <div class="progress-bar"><div class="fill ${barClass}" style="width:${barWidth}%"></div></div>
                    </div>`;
          item.onclick = () => selectNode(inst, item);
          list.appendChild(item);
        });
      }

      // 初始化图表
      function initCharts() {
        const creditChart = echarts.init(
          document.getElementById('creditChart'),
        );
        creditChart.setOption({
          grid: { top: 20, left: 40, right: 20, bottom: 30 },
          xAxis: {
            type: 'category',
            data: ['Q1', 'Q2', 'Q3', 'Q4'],
            axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
            axisLabel: { color: '#888', fontSize: 10 },
          },
          yAxis: {
            type: 'value',
            axisLine: { show: false },
            splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } },
            axisLabel: { color: '#888', fontSize: 10, formatter: '${value}B' },
          },
          series: [
            {
              type: 'line',
              smooth: true,
              data: [2.1, 2.4, 2.6, 2.84],
              lineStyle: { color: '#ffd700', width: 2 },
              areaStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                  { offset: 0, color: 'rgba(255, 215, 0, 0.3)' },
                  { offset: 1, color: 'rgba(255, 215, 0, 0)' },
                ]),
              },
              itemStyle: { color: '#ffd700' },
            },
          ],
        });
      }

      // 选择节点
      function selectNode(inst, element) {
        document
          .querySelectorAll('.ranking-item')
          .forEach((el) => el.classList.remove('active'));
        if (element) element.classList.add('active');
        selectedNode = inst;
      }

      // 按区域筛选
      function filterNodesByRegion() {
        nodeSpheres.forEach((sphere, i) => {
          const inst = sphere.userData.inst;
          const visible =
            currentRegion === 'global' || inst.region === currentRegion;
          sphere.visible = visible;
          connectionLines[i].line.visible = visible;
          lineParticles[i].particles.visible = visible;
          nodeLabels[i].element.style.display = visible ? 'block' : 'none';
        });
      }

      // 鼠标事件
      function onMouseDown(e) {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        renderer.domElement.style.cursor = 'grabbing';
      }

      function onMouseUp() {
        isDragging = false;
        renderer.domElement.style.cursor = hoveredNode ? 'pointer' : 'default';
      }

      function onMouseMove(e) {
        if (isDragging) {
          const dx = e.clientX - lastMouseX,
            dy = e.clientY - lastMouseY;
          cameraAngleX += dx * 0.005;
          cameraAngleY = Math.max(
            -0.2,
            Math.min(0.7, cameraAngleY + dy * 0.005),
          );
          const r = 450;
          camera.position.set(
            Math.sin(cameraAngleX) * r * Math.cos(cameraAngleY),
            Math.sin(cameraAngleY) * r,
            Math.cos(cameraAngleX) * r * Math.cos(cameraAngleY),
          );
          camera.lookAt(0, 0, 0);
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
          return;
        }

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const visibleSpheres = nodeSpheres.filter((s) => s.visible);
        const hits = raycaster.intersectObjects([
          coreSphere,
          ...visibleSpheres,
        ]);

        // 恢复状态
        if (hoveredNode) {
          if (hoveredNode.userData.isCore) {
            coreSphere.userData.glow.material.opacity = 0.2;
          } else {
            // 恢复时隐藏光环
            hoveredNode.userData.ring.material.opacity = 0;
            hoveredNode.userData.isSelected = false;
          }
          const lineData = connectionLines.find(
            (l) => l.inst === hoveredNode.userData.inst,
          );
          if (lineData) {
            // 恢复默认灰色
            lineData.line.material.color.setHex(0x888888);
            lineData.line.material.opacity = lineData.line.userData.baseOpacity;
          }
        }

        if (hits.length > 0) {
          const obj = hits[0].object;
          hoveredNode = obj;
          renderer.domElement.style.cursor = 'pointer';

          if (obj.userData.isCore) {
            coreSphere.userData.glow.material.opacity = 0.4;
          } else {
            obj.userData.ring.material.opacity = 0.6;
            obj.userData.isSelected = true;
            const lineData = connectionLines.find(
              (l) => l.inst === obj.userData.inst,
            );
            if (lineData) {
              // 高亮连线：使用球体颜色
              const sphereColor = new THREE.Color(obj.userData.inst.color);
              lineData.line.material.color.copy(sphereColor);
              lineData.line.material.opacity = 0.7;
            }
            selectNode(obj.userData.inst, null);
          }
        } else {
          hoveredNode = null;
          renderer.domElement.style.cursor = 'default';
        }
      }

      // 点击空白处取消选中
      function onClick(e) {
        // 如果点击的不是球体，取消选中
        if (!hoveredNode && selectedNode) {
          selectedNode = null;
          // 刷新UI显示
          const items = document.querySelectorAll('.ranking-item');
          items.forEach((item) => item.classList.remove('active'));
        }
      }

      function onWheel(e) {
        e.preventDefault();
        camera.position.multiplyScalar(e.deltaY > 0 ? 1.08 : 0.92);
        camera.position.clampLength(200, 800);
      }

      // 更新标签位置
      function updateLabels() {
        if (window.coreLabel) {
          const p = window.coreLabel.sphere.position.clone();
          p.y += 45;
          p.project(camera);
          window.coreLabel.element.style.left =
            (p.x * 0.5 + 0.5) * window.innerWidth + 'px';
          window.coreLabel.element.style.top =
            (-p.y * 0.5 + 0.5) * window.innerHeight - 20 + 'px';
          window.coreLabel.element.style.opacity = p.z > 1 ? '0' : '1';
        }

        nodeLabels.forEach((l, i) => {
          if (!l.sphere.visible) {
            l.element.style.display = 'none';
            return;
          }
          const inst = l.inst;
          const isSelected = selectedNode && selectedNode.name === inst.name;
          const offsetY = isSelected ? 40 : 20;

          const p = l.sphere.position.clone();
          p.y += offsetY;
          p.project(camera);

          if (isSelected && !l.isExtended) {
            l.element.classList.add('extended');
            l.element.innerHTML = `
                        <div class="name">${inst.name}</div>
                        <div class="amount">${inst.credit}</div>
                        <div class="stats">
                            <div class="stat">已用 <span>${inst.used}</span></div>
                            <div class="stat">履约 <span>${inst.rate}</span></div>
                        </div>`;
            l.isExtended = true;
          } else if (!isSelected && l.isExtended) {
            l.element.classList.remove('extended');
            l.element.innerHTML = `<div class="abbr">${inst.abbr}</div><div class="amount">${inst.credit}</div>`;
            l.isExtended = false;
          }

          l.element.style.left = (p.x * 0.5 + 0.5) * window.innerWidth + 'px';
          l.element.style.top =
            (-p.y * 0.5 + 0.5) * window.innerHeight - 10 + 'px';
          l.element.style.opacity = p.z > 1 ? '0' : '1';
        });
      }

      // 更新连线粒子 - 简化版：单个粒子依次发出
      function updateLineParticles() {
        lineParticles.forEach((data) => {
          if (!data.particles.visible) return;

          const pos = data.particles.geometry.attributes.position.array;
          const sp = data.sphere.position;
          const ang = data.sphere.userData.angle;
          const sphere = data.sphere;

          // 计算背离中心的方向
          const dirX = Math.cos(ang);
          const dirZ = Math.sin(ang);
          const radius = sphere.userData.baseSize || 15;

          // 帧计数器
          data.frameCount = (data.frameCount || 0) + 1;

          data.velocities.forEach((v, i) => {
            // 每个粒子依次发射，每30帧一个新粒子
            if (!v.active && data.frameCount >= i * 30 + 50) {
              // 粒子激活，从球体最外侧开始
              pos[i * 3] = sp.x + dirX * (radius + 2);
              pos[i * 3 + 1] = sp.y + 2;
              pos[i * 3 + 2] = sp.z + dirZ * (radius + 2);

              // 速度：沿背离中心方向直线移动
              v.x = dirX * 0.15;
              v.y = 0;
              v.z = dirZ * 0.15;

              v.active = true;
              v.life = 0;
            }

            if (v.active) {
              // 直线移动
              pos[i * 3] += v.x;
              pos[i * 3 + 1] += v.y;
              pos[i * 3 + 2] += v.z;

              v.life++;

              // 存活150帧后消失，然后新粒子会继续发射
              const maxLife = 300;

              if (v.life > maxLife) {
                v.active = false;
                // 重置到球体位置
                pos[i * 3] = sp.x + dirX * (radius + 2);
                pos[i * 3 + 1] = sp.y + 2;
                pos[i * 3 + 2] = sp.z + dirZ * (radius + 2);
              }
            }
          });

          data.particles.geometry.attributes.position.needsUpdate = true;
        });
      }

      // 动画循环
      function animate() {
        requestAnimationFrame(animate);
        const time = Date.now();

        // 核心球体自转
        coreSphere.rotation.y += 0.003;

        // 核心光环动画
        coreGlowRings.forEach((ring, i) => {
          ring.rotation.z += ring.userData.speed;
          // 移除暗度变化效果，使用固定透明度
          ring.material.opacity = ring.userData.baseOpacity;
        });

        // 核心光晕呼吸
        coreSphere.userData.glow.material.opacity =
          0.15 + Math.sin(time * 0.003) * 0.08;

        // 节点动画
        nodeSpheres.forEach((sphere, i) => {
          if (!sphere.visible) return;

          const inst = sphere.userData.inst;
          const isSelected = selectedNode && selectedNode.name === inst.name;
          const isHovered = hoveredNode === sphere;

          // 未选中且未悬停时公转
          if (!isSelected && !isHovered) {
            sphere.userData.angle += ORBIT_SPEED;
          }

          sphere.position.set(
            Math.cos(sphere.userData.angle) * inst.orbitRadius,
            inst.orbitY + Math.sin(time * 0.002 + i) * 3,
            Math.sin(sphere.userData.angle) * inst.orbitRadius,
          );

          // 球体保持固定大小
          sphere.scale.set(1, 1, 1);

          // 蓝色光圈 - 跟随球体
          if (sphere.userData.glowRing) {
            sphere.userData.glowRing.position.copy(sphere.position);
            sphere.userData.glowRing.lookAt(camera.position);
          }
          // 白色半圆 - 面对相机，顺时针绕球心旋转
          if (sphere.userData.arc) {
            const arc = sphere.userData.arc;
            // 累积旋转
            arc.userData.rot = (arc.userData.rot || 0) + 0.015;
            const angle = arc.userData.rot;

            // 位置跟随球体中心
            arc.position.copy(sphere.position);
            // 面向相机
            arc.lookAt(camera.position);
            // 绕Z轴顺时针旋转（在面向相机的平面）
            arc.rotation.z = -angle;
          }

          // 选中或悬停状态 - 显示光环
          if (isSelected || isHovered) {
            sphere.userData.ring.material.opacity = isSelected ? 0.5 : 0.4;
            sphere.userData.ring.scale.set(1.15, 1.15, 1);
          } else {
            sphere.userData.ring.material.opacity = 0;
            sphere.userData.ring.scale.set(1, 1, 1);
          }

          // 警示节点 - 选中/悬停时显示并闪烁
          if (sphere.userData.isWarning && sphere.userData.warningRing) {
            if (isSelected || isHovered) {
              const flash = 0.5 + Math.sin(time * 0.01) * 0.5;
              sphere.userData.warningRing.material.opacity = flash;
              const warningScale = 1 + Math.sin(time * 0.008) * 0.15;
              sphere.userData.warningRing.scale.set(
                warningScale,
                warningScale,
                1,
              );
            } else {
              sphere.userData.warningRing.material.opacity = 0;
              sphere.userData.warningRing.scale.set(1, 1, 1);
            }
          }

          // 更新连线
          const lineData = connectionLines[i];
          if (!lineData || !lineData.line) return;
          // 重建连线曲线
          const newCurve = new THREE.QuadraticBezierCurve3(
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(
              sphere.position.x * 0.5,
              inst.curveHeight,
              sphere.position.z * 0.5,
            ),
            sphere.position.clone(),
          );
          lineData.line.geometry.dispose();
          lineData.line.geometry = new THREE.BufferGeometry().setFromPoints(
            newCurve.getPoints(50),
          );
          // 保存新的曲线和球体引用用于hover时重建
          lineData.line.userData.curve = newCurve;
          lineData.line.userData.sphereRef = sphere;

          // 更新标签状态
          nodeLabels[i].isExtended = isSelected;
        });

        // 星空缓慢旋转
        if (starField) {
          starField.rotation.y += 0.0001;
          starField.rotation.x += 0.00005;
        }

        updateLineParticles();
        updateLabels();
        renderer.render(scene, camera);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      init();
    </script>
  </body>
</html>
